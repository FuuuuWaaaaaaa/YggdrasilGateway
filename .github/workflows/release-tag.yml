name: Release Tag

on:
  push:
    tags:
      - "**"


jobs:
  build:
    uses: ./.github/workflows/common-build.yml
    with:
      withFrontend: true
      doUpload: true

  publish_snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: 'dist'
          name: docker-image

      - uses: actions/download-artifact@v4
        with:
          path: 'dist'
          name: distribution-zip

      - uses: actions/download-artifact@v4
        with:
          path: 'dist'
          name: distribution-tar


      - name: Create release
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} -d --notes-from-tag dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Publish image to GitHub Container Registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker load -i dist/yggdrasilgateway.docker.tar.gz
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag yggdrasilgateway "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"
